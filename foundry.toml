[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"

# Pinned compiler settings — part of the deployment identity. DO NOT change
# after the first deployment: Sourcify verification (full match) re-compiles
# the exact source with these exact settings.
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
